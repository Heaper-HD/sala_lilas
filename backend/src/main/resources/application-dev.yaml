spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/salalilas_dev
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    "[com.fadergs.salalilas]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.springframework.web]": DEBUG
    "[org.hibernate.sql]": debug
    "[org.hibernate.type.descriptor.sql]": trace

app:
  frontend:
    callback-url: http://localhost:3000/oauth2/callback
  pdf:
    storage-path: /tmp/salalilas/pdfs
