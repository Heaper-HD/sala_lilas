spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    root: WARN
    "[com.fadergs.salalilas]": INFO
  file:
    name: /var/log/salalilas/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

app:
  frontend:
    callback-url: ${FRONTEND_URL}/oauth2/callback
  pdf:
    storage-path: ${PDF_STORAGE_PATH}
